[workspace]
resolver = "2"
members = ["contracts/shared", "contracts/trust", "contracts/collection"]
exclude = ["enclave/trustee"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"
serde_json = "1"
base64 = "0.22"
hex = "0.4"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
