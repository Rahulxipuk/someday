<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Someday</title>
    <meta
      name="description"
      content="Someday is a trust fund you hold as an NFT. The holder cannot withdraw. They ask, an AI trustee decides, and the contract pays only within hard limits."
    />
    <meta name="theme-color" content="#f5eee0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181311" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,50;1,9..144,300..600,50&family=Instrument+Sans:wght@400;500;600&display=swap"
    />
    <script>
      // Set the theme before first paint, so a saved dark theme never flashes light.
      try {
        const theme = localStorage.getItem('someday:theme');
        if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
